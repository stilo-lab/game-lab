<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel – Animationen</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;background:#11121a;color:#edf0ff;margin:0;padding:32px;max-width:1100px;margin:auto}h1{font-size:32px;margin:0 0 8px}p{color:#bac1d9}button{background:#34375a;border:1px solid #636b9f;color:white;border-radius:20px;padding:9px 17px;cursor:pointer;margin:4px}button[aria-pressed=true]{background:#615af0;border-color:#c7c1ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-top:24px}.pet{background:#1c1e2d;border:1px solid #393d59;border-radius:16px;padding:18px;text-align:center}.pet img{width:128px;height:128px;image-rendering:pixelated}.pet h2{font-size:18px;margin:8px 0}.pet small{display:block;line-height:1.5;color:#bac1d9}footer{margin-top:24px;color:#8e98bc;font-size:13px}</style>
<h1>Wähle deinen Pixel ✨</h1><p>Zehn Begleiter. Eigene Animationen. Im Bot mit <b>/pixel</b> auswählen.</p><nav id="states"></nav><main class="grid" id="pets"></main><footer>Diese Vorschau lädt nur die lokalen Bilddateien. Gojo nutzt im Bot weiterhin seine bereits installierten Animationen.</footer>
<script>
const chars=[['gojo','Gojo','Dein bisheriger Magier'],['sukuna','Sukuna','Rote Funken'],['geto','Geto','Geister-Orbs jonglieren'],['nanami','Nanami','Uhr, Brille und Notizbuch'],['toji','Toji','Münztrick und Sprungpose'],['zelda','Zelda','Runen · Harfe · Licht'],['link','Link','Karte · Angeln · Schatz'],['nova','Nova','Hologramme · Akku · Funken'],['ember','Ember','Briefe · Schlafen · Blätter'],['luna','Luna','Tränke · Teleskop · Sterne']];
const states=[['idle','Entspannt'],['laptop','Arbeiten'],['waiting','Warten / AFK'],['all','Eigene Animation']];let selected='all';
function render(){document.getElementById('states').replaceChildren(...states.map(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(id===selected));b.onclick=()=>{selected=id;render()};return b}));document.getElementById('pets').replaceChildren(...chars.map(([id,label,description])=>{const c=document.createElement('article');c.className='pet';const image=document.createElement('img');image.alt='Pixel '+label;image.src=id==='gojo'?'../pixel-characters/gojo/portrait.png':'../pixel-characters/'+id+'/'+selected+'.gif';const h=document.createElement('h2');h.textContent=label;const small=document.createElement('small');small.textContent=description;c.append(image,h,small);return c}))}render();
</script></html>
